<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Store the path the user tried to go to (e.g., /writing)
    sessionStorage.setItem('redirect', window.location.href);
    // Redirect to the main app
    window.location.href = '/';
  </script>
</head>
